services:
  avatar-ml-api:
    build:
      context: ..
      dockerfile: Model1/Dockerfile
    ports:
      - "127.0.0.1:8001:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    environment:
      API_KEY: ${API_KEY:?Set API_KEY through the runtime secret environment}
      APP_ENV: production
      PYTHONDONTWRITEBYTECODE: "1"
      MODEL_DIR: /app/Model1/models
      MODEL_B_DIR: /app/Model2/models
      MODEL_B_AUDIT_DB: /app/Model2/var/model_b_audit.sqlite3
    volumes:
      - ../Model1/models:/app/Model1/models:ro
      - ../Model1/reports:/app/Model1/reports:ro
      - ../Model2/models:/app/Model2/models:ro
      - model_b_audit_data:/app/Model2/var

volumes:
  model_b_audit_data:
