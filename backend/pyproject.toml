[project]
name = "avatar-backend"
version = "0.1.0"
description = "AVATAR food production, costing, inventory and traceability API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "pymysql>=1.1,<2.0",
  "redis>=5.0,<7.0",
  "python-jose[cryptography]>=3.3,<4.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "scikit-learn>=1.5,<2.0",
  "pandas>=2.2,<4.0",
  "numpy>=1.26,<3.0",
  "joblib>=1.4,<2.0",
  "python-multipart>=0.0.9",
  "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "httpx>=0.27,<1.0", "ruff>=0.6,<1.0", "mypy>=1.11,<2.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# FastAPI evaluates Depends/require/File/Form declarations as route parameter defaults.
"app/api/v1/*.py" = ["B008"]
# The readiness route intentionally maps any DB failure to a generic 503; ML is deliberately fail-soft.
"app/main.py" = ["BLE001"]
"app/ml/service.py" = ["BLE001"]
# Report text is built from adjacent string literals on purpose.
"scripts/ai_report.py" = ["ISC004"]

[tool.setuptools.packages.find]
include = ["app*"]
