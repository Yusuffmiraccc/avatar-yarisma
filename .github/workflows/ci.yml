name: AVATAR CI Pipeline

on:
  push:
    branches: [ "main", "feature/*", "fix/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: change-root-local-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pchange-root-local-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_ROOT_URL: mysql+pymysql://root:change-root-local-only@127.0.0.1:3306/?charset=utf8mb4
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Pytest Suite
        run: |
          cd backend
          python -m pytest tests/ -v

  web-test:
    name: Web Frontend Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & Run Tests
        run: |
          cd web
          npm ci || npm install
          npm run test
          npm run build

  android-test:
    name: Android Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Run Android Unit Tests & Assemble Debug APK
        run: |
          cd android
          ./gradlew testDebugUnitTest assembleDebug
